<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BFA5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Hub with flow nodes -->
  <!-- Central hub circle -->
  <circle cx="40" cy="40" r="14" fill="url(#hubGrad)" />
  <!-- Hub letter -->
  <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">H</text>

  <!-- Flow lines from hub -->
  <line x1="26" y1="32" x2="16" y2="20" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="64" y2="20" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="54" x2="40" y2="67" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Satellite nodes -->
  <circle cx="11" cy="15" r="7" fill="#0077B6" />
  <text x="11" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF">F</text>

  <circle cx="69" cy="15" r="7" fill="#0077B6" />
  <text x="69" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF">F</text>

  <circle cx="40" cy="72" r="7" fill="#00BFA5" />
  <text x="40" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF">$</text>

  <!-- Wordmark -->
  <text x="92" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2F5B">Fund</text>
  <text x="92" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="url(#flowGrad)">FlowHub</text>
</svg>
