<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Central hub -->
  <circle cx="40" cy="40" r="16" fill="url(#iconGrad)" />
  <text x="40" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">H</text>

  <!-- Flow lines -->
  <line x1="25" y1="30" x2="14" y2="17" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="30" x2="66" y2="17" stroke="#00BFA5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="56" x2="40" y2="69" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Satellite nodes (Fund, Flow, $) -->
  <circle cx="10" cy="13" r="9" fill="#0077B6"/>
  <text x="10" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Fu</text>

  <circle cx="70" cy="13" r="9" fill="#0077B6"/>
  <text x="70" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Fl</text>

  <circle cx="40" cy="73" r="9" fill="#00BFA5"/>
  <text x="40" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">$</text>
</svg>
