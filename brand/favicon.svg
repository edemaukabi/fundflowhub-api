<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" fill="#1B2F5B" rx="12"/>

  <!-- Central hub -->
  <circle cx="32" cy="32" r="11" fill="url(#favGrad)" />
  <text x="32" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">H</text>

  <!-- Flow lines -->
  <line x1="21" y1="24" x2="13" y2="14" stroke="#00BFA5" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="24" x2="51" y2="14" stroke="#00BFA5" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="43" x2="32" y2="53" stroke="#0077B6" stroke-width="2" stroke-linecap="round"/>

  <!-- Satellite nodes -->
  <circle cx="10" cy="11" r="5" fill="#00BFA5"/>
  <circle cx="54" cy="11" r="5" fill="#00BFA5"/>
  <circle cx="32" cy="56" r="5" fill="#0077B6"/>
</svg>
